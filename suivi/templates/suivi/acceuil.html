async function hsh(p,salt){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'p'+btoa(unescape(encodeURIComponent(salt+p)))}}

function sbar(v){const n=pscore(v),c=['#c8343c','#d08a1e','#d9a914','#1e8a4c'][Math.max(n-1,0)];return `<div class="sm">${[0,1,2,3].map(i=>`<i style="${i<n?'background:'+c:''}"></i>`).join('')}</div><div class="mut" style="font-size:12px">${v?['Trop faible','Faible','Correct','Fort','Très fort'][n]:'8 caractères min., majuscule, minuscule et chiffre'}</div>`}

function eye(b){const i=b.parentNode.querySelector('input'),s=i.type=='password';i.type=s?'text':'password';b.textContent=s?'🙈':'👁'}
function vf(t){const f=t.closest('.fl'),v=t.value,k=t.dataset.v||'req';let m='';
if(!v.trim())m='Champ requis';
else if(k=='email'&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.trim()))m='Adresse e-mail invalide';
else if(k=='tel'&&!/^\+?[\d\s]{8,16}$/.test(v.trim()))m='Numéro invalide (8 chiffres minimum)';
else if(k=='pw'){if(pscore(v)<3||v.length<8)m='8 caractères minimum, avec majuscule, minuscule et chiffre';const s=t.form.querySelector('.sbox');if(s)s.innerHTML=sbar(v);if(t.form.cfm&&t.form.cfm.value)vf(t.form.cfm)}
else if(k=='cf'&&v!==t.form.npw.value)m='Les mots de passe ne correspondent pas';
f.classList.toggle('er',!!m);f.querySelector('.em').textContent=m;return !m}

<div class="card" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px"><h3>Messages reçus (Formulaire de contact)</h3><button class="btn alt sm" onclick="view='msg';route()">Voir tout (${M.length})</button></div>${M.slice(0,5).map(m=>`<p style="margin:8px 0;padding-bottom:8px;border-bottom:1px solid var(--line)">${badge(m.sj)} <b>${esc(m.nom)}</b> (<a href="mailto:${esc(m.email)}"><u>${esc(m.email)}</u></a>) ${m.date?`<small class="mut">· ${esc(m.date)}</small>`:''} ${m.traite?badge('Résolu').replace('Résolu','Traité'):''}<br><span class="mut">${esc(m.msg)}</span></p>`).join('')||'<p class="mut">Aucun message reçu depuis le formulaire de contact.</p>'}</div>`;
if(window.Chart){charts.push(new Chart($('#g1'),{type:'doughnut',data:{labels:ST,datasets:[{data:ST.map(cnt),backgroundColor:['#1e8a4c','#c8343c','#d9a914','#6f8aa6']}]}}),new Chart($('#g2'),{type:'bar',data:{labels:rs,datasets:[{label:'Points d’eau',data:rs.map(r=>D.pts.filter(p=>rg(p)==r).length),backgroundColor:['#1e8a4c','#d9a914','#c8343c','#b5703a','#6f8aa6','#1b3148']}]},options:{plugins:{legend:{display:false}}}}))}}
function msg(c){const M=D.messages||[];c.innerHTML=`<h2>Messages de contact</h2><p class="mut">Messages envoyés depuis le formulaire « Parlons de l’eau » sur la page d’accueil.</p>`+table(['Date','Sujet','Nom complet','E-mail','Message','Statut','Action'],M.map((m,i)=>`<tr><td>${esc(m.date||'Aujourd’hui')}</td><td>${badge(m.sj)}</td><td><b>${esc(m.nom)}</b></td><td><a href="mailto:${esc(m.email)}"><u>${esc(m.email)}</u></a></td><td>${esc(m.msg)}</td><td>${m.traite?badge('Résolu').replace('Résolu','Traité'):badge('En maintenance').replace('En maintenance','Nouveau')}</td><td>${m.traite?'':`<button class="btn sm" onclick="setMsgS(${i},true)">Traiter</button> `}<button class="btn alt sm" onclick="delMsg(${i})">Supprimer</button></td></tr>`).join(''))}
function geo(c){c.innerHTML=`<h2>Gestion géographique</h2><p class="mut">Région → Cercle → Commune → Village</p><div class="tools"><input id="q" placeholder="Rechercher…" oninput="fl()"><button class="btn" onclick="addV()">Ajouter un village</button></div>`+table(['Village','Commune','Cercle','Région',''],'','tb');fl=()=>{const q=$('#q').value.toLowerCase();$('#tb').innerHTML=D.villages.map((v,i)=>({v,i})).filter(o=>JSON.stringify(o.v).toLowerCase().includes(q)).map(({v,i})=>`<tr><td>${esc(v.n)}</td><td>${esc(v.c)}</td><td>${esc(v.ce)}</td><td>${esc(v.r)}</td><td><button class="btn alt sm" onclick="delV(${i})">Supprimer</button></td></tr>`).join('')||'<tr><td colspan=5 class="mut">Aucun résultat.</td></tr>'};fl()}
let fl;
function addV(){modal(`<h3>Nouveau village</h3><form><label>Village</label><input name="n" required><label>Commune</label><input name="c" required><label>Cercle</label><input name="ce" required><label>Région</label><input name="r" required><p><button class="btn">Enregistrer</button></p></form>`,d=>{D.villages.push(d);toast('Village ajouté');geo($('#c'))})}
function delV(i){const v=D.villages[i];if(D.pts.some(p=>p.v==v.n))return toast('Suppression impossible : des points d’eau en dépendent');if(confirm('Supprimer '+v.n+' ?')){D.villages.splice(i,1);toast('Supprimé');fl()}}
function pts(c){c.innerHTML=`<h2>Points d’eau</h2><div class="tools"><input id="q" placeholder="Rechercher…" oninput="fl()"><select id="s" onchange="fl()"><option value="">Tous les états</option>${ST.map(s=>`<option>${s}</option>`).join('')}</select><button class="btn" onclick="addP()">Ajouter</button></div>`+table(['Réf.','Nom','Type','Village','État','Changer l’état','Carte'],'','tb');
fl=()=>{const q=$('#q').value.toLowerCase(),s=$('#s').value;$('#tb').innerHTML=D.pts.map((p,i)=>({p,i})).filter(o=>(!s||o.p.s==s)&&JSON.stringify(o.p).toLowerCase().includes(q)).map(({p,i})=>`<tr><td>${p.ref}</td><td>${esc(p.n)}</td><td>${p.t}</td><td>${esc(p.v)}</td><td>${badge(p.s)}</td><td><select onchange="setS(${i},this.value)">${ST.map(x=>`<option ${x==p.s?'selected':''}>${x}</option>`).join('')}</select></td><td><button class="btn alt sm" onclick="view='map';SEL='${p.ref}';route()">${p.la!=null?'Localiser':'Sans position'}</button></td></tr>`).join('')||'<tr><td colspan=7 class="mut">Aucun résultat.</td></tr>'};fl()}
function addP(){modal(`<h3>Nouveau point d’eau</h3><form><label>Référence</label><input name="ref" required><label>Nom</label><input name="n" required><label>Type</label><select name="t"><option>Forage</option><option>Puits</option><option>Autre</option></select><label>Village</label><select name="v">${D.villages.map(v=>`<option>${esc(v.n)}</option>`).join('')}</select><label>Latitude (facultatif)</label><input name="la" type="number" step="any"><label>Longitude (facultatif)</label><input name="lo" type="number" step="any"><p><button type="button" class="btn alt sm" onclick="gps()">Utiliser ma position</button></p><p><button class="btn">Enregistrer</button></p></form>`,d=>{if(D.pts.some(p=>p.ref==d.ref)){toast('Référence déjà utilisée');return false}d.la=d.la===''?null:+d.la;d.lo=d.lo===''?null:+d.lo;if((d.la!=null||d.lo!=null)&&!okPos(d.la,d.lo)){toast('Position invalide : latitude 10 à 25, longitude −12,5 à 4,4');return false}d.s='Fonctionnel';d.log=[{d:today(),s:'Fonctionnel',n:'Création'}];D.pts.push(d);toast('Point d’eau ajouté');pts($('#c'))})}
function pan(c){c.innerHTML=`<h2>Pannes et signalements</h2>`+table(['Point','Description','Priorité','Statut','Technicien','Action'],D.pannes.map((p,i)=>`<tr><td>${p.pt}</td><td>${esc(p.d)}</td><td>${badge(p.p)}</td><td>${badge(p.s)}</td><td>${esc(p.tech||'—')}</td><td>${p.s=='Résolu'?`<button class="btn sm" onclick="setP(${i},'Clôturé')">Clôturer</button>`:p.s=='Clôturé'?'':`<button class="btn sm" onclick="aff(${i})">Affecter</button>`}</td></tr>`).join(''))}
function setP(i,s){D.pannes[i].s=s;toast('Statut : '+s);pan($('#c'))}
function aff(i){modal(`<h3>Affecter un technicien</h3><form><select name="t">${D.techs.map(t=>`<option>${t}</option>`).join('')}</select><p><button class="btn">Affecter</button></p></form>`,d=>{D.pannes[i].tech=d.t;D.pannes[i].s='Technicien affecté';toast('Intervention créée pour '+d.t);pan($('#c'))})}
function tec(c){c.innerHTML=`<h2>Techniciens</h2>`+table(['Nom','Interventions affectées','En cours'],D.techs.map(t=>`<tr><td>${t}</td><td>${D.pannes.filter(p=>p.tech==t).length}</td><td>${D.pannes.filter(p=>p.tech==t&&p.s=='En cours de réparation').length}</td></tr>`).join(''))}
function stk(c){c.innerHTML=`<h2>Gestion du stock</h2>`+table(['Pièce','Réf.','Quantité','Seuil','Mouvement'],D.stock.map((s,i)=>`<tr><td>${esc(s.n)}</td><td>${s.ref}</td><td>${s.q<=s.min?badge('En panne').replace('En panne',s.q):s.q}</td><td>${s.min}</td><td><button class="btn sm" onclick="mv(${i},1)">Entrée</button> <button class="btn alt sm" onclick="mv(${i},-1)">Sortie</button></td></tr>`).join(''))+`<h3 style="margin-top:16px">Historique des mouvements</h3>`+table(['Mouvement'],D.hist.map(h=>`<tr><td>${esc(h)}</td></tr>`).join(''))}
function mv(i,s){modal(`<h3>${s>0?'Entrée':'Sortie'} : ${esc(D.stock[i].n)}</h3><form><label>Quantité</label><input name="q" type="number" min="1" required><p><button class="btn">Valider</button></p></form>`,d=>{const q=+d.q;if(s<0&&q>D.stock[i].q){toast('Stock insuffisant : '+D.stock[i].q+' disponible(s)');D.notifs.push('Stock insuffisant : '+D.stock[i].n);return false}D.stock[i].q+=s*q;D.hist.unshift((s>0?'+':'−')+q+' '+D.stock[i].n);if(D.stock[i].q<=D.stock[i].min)D.notifs.push('Stock faible : '+D.stock[i].n);toast('Mouvement enregistré');stk($('#c'))})}
function rep(c){const n=D.pts.length,f=D.pts.filter(p=>p.s=='Fonctionnel').length;c.innerHTML=`<h2>Rapports</h2><div class="kpis"><div class="card"><b>${Math.round(f/n*100)}%</b>Taux de disponibilité</div><div class="card"><b>${D.pannes.length}</b>Pannes signalées</div></div><div class="card"><canvas id="g3"></canvas></div><p><button class="btn" onclick="csv()">Exporter en CSV</button></p>`;if(window.Chart)charts.push(new Chart($('#g3'),{type:'bar',data:{labels:D.villages.map(v=>v.n),datasets:[{label:'Points d’eau',data:D.villages.map(v=>D.pts.filter(p=>p.v==v.n).length),backgroundColor:'#6f8aa6'}]}}))}
function csv(){const t='ref;nom;type;village;etat\n'+D.pts.map(p=>[p.ref,p.n,p.t,p.v,p.s].join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='points-eau.csv';a.click()}
/* RESPONSABLE LOCAL */
function localHome(c){c.innerHTML=`<h2>Points d’eau de ${U.village}</h2>`+table(['Réf.','Nom','État'],D.pts.filter(p=>p.v==U.village).map(p=>`<tr><td>${p.ref}</td><td>${esc(p.n)}</td><td>${badge(p.s)}</td></tr>`).join(''))}
function dec(c){c.innerHTML=`<h2>Déclarer une panne</h2><form class="card" style="max-width:480px" id="df"><label>Point d’eau</label><select name="pt">${D.pts.filter(p=>p.v==U.village).map(p=>`<option>${p.ref}</option>`).join('')}</select><label>Description</label><textarea name="d" required></textarea><label>Priorité</label><select name="p"><option>Faible</option><option>Moyenne</option><option>Élevée</option><option>Critique</option></select><label>Photo (facultative)</label><input type="file" accept="image/*"><p><button class="btn">Envoyer le signalement</button></p></form>`;$('#df').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));D.pannes.push({id:Date.now(),pt:d.pt,d:d.d,p:d.p,s:'Nouveau signalement',by:U.name,tech:''});D.notifs.push('Nouveau signalement : '+d.pt);toast('Signalement envoyé');view='mes';route()}}
function mes(c){const mine=D.pannes.filter(p=>(p.by_email&&U.email)?p.by_email==U.email.toLowerCase():p.by==U.name);c.innerHTML=`<h2>Mes signalements</h2>`+table(['Point','Description','Statut'],mine.map(p=>`<tr><td>${p.pt}</td><td>${esc(p.d)}</td><td>${badge(p.s)}</td></tr>`).join(''))}
/* TECHNICIEN */
function techHome(c){const m=D.pannes.filter(p=>(p.tech_email&&U.email)?p.tech_email==U.email.toLowerCase():p.tech==U.name);const n=s=>m.filter(p=>p.s==s).length;
c.innerHTML=`<h2>Mes interventions</h2><div class="kpis"><div class="card"><b>${m.length}</b>Attribuées</div><div class="card"><b>${n('En cours de réparation')}</b>En cours</div><div class="card"><b>${n('Résolu')+n('Clôturé')}</b>Terminées</div><div class="card"><b>${n('Technicien affecté')}</b>En attente</div></div>`+table(['Point','Panne','Statut','Action'],m.map(p=>{const i=D.pannes.indexOf(p);return `<tr><td>${p.pt}</td><td>${esc(p.d)}</td><td>${badge(p.s)}</td><td>${p.s=='Technicien affecté'?`<button class="btn sm" onclick="setP2(${i},'En cours de réparation')">Démarrer</button>`:p.s=='En cours de réparation'?`<button class="btn sm" onclick="fin(${i})">Terminer</button>`:''}</td></tr>`}).join(''))}
function setP2(i,s){D.pannes[i].s=s;D.notifs.push('Statut modifié : '+D.pannes[i].pt);toast('Intervention démarrée');techHome($('#c'))}
function fin(i){modal(`<h3>Terminer l’intervention</h3><form><label>Compte rendu</label><textarea name="r" required></textarea><label>Pièce utilisée</label><select name="pc"><option value="">Aucune</option>${D.stock.map((s,j)=>`<option value="${j}">${esc(s.n)} (${s.q})</option>`).join('')}</select><label>Quantité</label><input name="q" type="number" min="1" value="1"><p><button class="btn">Terminer</button></p></form>`,d=>{if(d.pc!==''){const s=D.stock[+d.pc];if(+d.q>s.q){toast('Stock insuffisant');return false}s.q-=+d.q;D.hist.unshift('−'+d.q+' '+s.n+' (intervention '+D.pannes[i].pt+')');if(s.q<=s.min)D.notifs.push('Stock faible : '+s.n)}D.pannes[i].s='Résolu';D.notifs.push('Intervention terminée : '+D.pannes[i].pt);toast('Intervention terminée');techHome($('#c'))})}
/* CONTACT */
function cForm(){return `<form id="cf" novalidate onsubmit="return cSend(event)"><b>Sujet</b><div class="sj">${['Information','Signaler une panne','Partenariat','Autre'].map((x,i)=>`<button type="button" class="${i?'':'on'}" data-v="${x}" onclick="cSj(this)">${x}</button>`).join('')}</div><input type="hidden" name="sj" id="cs" value="Information"><div class="fl"><input name="nom" placeholder=" " autocomplete="name" oninput="cVal(this)"><label>Nom complet</label><div class="em"></div></div><div class="fl"><input name="email" type="email" placeholder=" " autocomplete="email" oninput="cVal(this)"><label>Adresse e-mail</label><div class="em"></div></div><div class="fl"><textarea name="msg" rows="5" maxlength="500" placeholder=" " oninput="cCount(this)"></textarea><label>Votre message</label><div class="em"></div></div><div class="cc" id="cn">0 / 500</div><p><button class="btn send" style="width:100%">Envoyer le message</button></p></form>`}
function cSj(b){document.querySelectorAll('.sj button').forEach(x=>x.classList.toggle('on',x==b));$('#cs').value=b.dataset.v}
function cCount(t){$('#cn').textContent=t.value.length+' / 500';cVal(t)}
function cVal(t){const f=t.closest('.fl'),v=t.value.trim();let m='';if(!v)m='Champ requis';else if(t.type=='email'&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))m='Adresse e-mail invalide';else if(t.name=='msg'&&v.length<10)m='Message trop court (10 caractères minimum)';f.classList.toggle('er',!!m);f.querySelector('.em').textContent=m;return !m}
function cSend(e){e.preventDefault();const f=e.target;const ok=[...f.querySelectorAll('input[name=nom],input[name=email],textarea')].map(cVal).every(Boolean);if(!ok){toast('Vérifiez les champs en rouge');return false}const b=f.querySelector('.send');b.disabled=true;b.textContent='Envoi en cours…';setTimeout(()=>{$('#cr').innerHTML=`<div class="okm"><div class="ck">✓</div><h3>Merci ${esc(f.nom.value.trim().split(' ')[0])} !</h3><p class="mut">Votre message « ${esc(f.sj.value)} » a bien été envoyé à notre équipe.</p><button class="btn alt" onclick="cReset()">Nouveau message</button></div>`},900);return false}
function cReset(){$('#cr').innerHTML=cForm()}
/* CARTOGRAPHIE */
const OUT=[[-4.8,25],[1.2,21],[4.2,19.15],[4.2,16],[3.5,15.3],[0.2,15],[-0.7,15.1],[-3,13.7],[-4.5,12.7],[-5.5,10.4],[-8,10.2],[-8.4,11.4],[-9.3,12],[-10.3,12.2],[-11.4,12.4],[-12.2,14.7],[-11.4,15.6],[-8.7,15],[-5.5,15.5],[-5.7,24.9]],RIV=[[-10.5,11.2],[-8,12.6],[-6.3,13.4],[-4.2,14.5],[-3.4,16.3],[-2,16.8],[0,16.3],[1.5,15.4],[3,14.9]],CITY=[['Bamako',-8,12.65],['Ségou',-6.26,13.43],['Mopti',-4.2,14.5],['Tombouctou',-3,16.77],['Gao',-0.04,16.27],['Kayes',-11.44,14.45],['Sikasso',-5.67,11.32]];
const CL={'Fonctionnel':'#1e8a4c','En panne':'#c8343c','En maintenance':'#d9a914','Hors service':'#6b7280'},LEG=ST.map(x=>`<span><i style="background:${CL[x]}"></i>${x}</span>`).join('');
const P2=(o,a)=>[((o+12.4)*40).toFixed(1),((25.2-a)*40).toFixed(1)].join(',');
function mapSvg(L){return `<svg class="map" id="mp" viewBox="0 0 680 620" role="img" aria-label="Carte des points d’eau du Mali"><g id="mg"><polygon points="${OUT.map(p=>P2(...p)).join(' ')}" fill="#fff" stroke="#6f8aa6" stroke-width="2"/><polyline points="${RIV.map(p=>P2(...p)).join(' ')}" fill="none" stroke="#8fb7d6" stroke-width="3" stroke-dasharray="6 4"/>${CITY.map(c=>{const[x,y]=P2(c[1],c[2]).split(',');return `<circle cx="${x}" cy="${y}" r="2.5" fill="#51677d"/><text class="cn" x="${+x+5}" y="${+y-4}" font-size="11" fill="#51677d">${c[0]}</text>`}).join('')}${L.filter(p=>p.la!=null).map(p=>{const[x,y]=P2(p.lo,p.la).split(','),c=CL[p.s];return `<g class="mk" tabindex="0" onclick="pick('${p.ref}')" onkeydown="if(event.key=='Enter')pick('${p.ref}')"><title>${p.ref} · ${esc(p.n)} (${p.s})</title>${p.s=='En panne'?`<circle class="pu" cx="${x}" cy="${y}" r="9" data-r="9" fill="${c}"/>`:''}<circle cx="${x}" cy="${y}" r="9" data-r="9" fill="${c}" stroke="#fff" stroke-width="2.5"/></g>`}).join('')}</g></svg>`}
let Z={k:1,x:0,y:0},MF={s:'',r:''},SEL='';
function zApply(){const g=$('#mg');if(!g)return;g.setAttribute('transform',`translate(${Z.x} ${Z.y}) scale(${Z.k})`);document.querySelectorAll('.mk circle').forEach(e=>e.setAttribute('r',e.dataset.r/Z.k));document.querySelectorAll('.cn').forEach(t=>t.setAttribute('font-size',11/Z.k))}
function zoom(f){if(!f||Z.k*f<=1){Z={k:1,x:0,y:0}}else{const k=Math.min(8,Z.k*f);Z.x=340-(340-Z.x)*k/Z.k;Z.y=310-(310-Z.y)*k/Z.k;Z.k=k}zApply()}
function mapInit(){Z={k:1,x:0,y:0};const s=$('#mp');if(!s)return;let dr=null;s.style.touchAction='none';s.onpointerdown=e=>{if(e.target.closest('.mk'))return;dr={x:e.clientX,y:e.clientY,a:Z.x,b:Z.y};s.setPointerCapture(e.pointerId)};s.onpointermove=e=>{if(!dr)return;const sc=680/s.getBoundingClientRect().width;Z.x=dr.a+(e.clientX-dr.x)*sc;Z.y=dr.b+(e.clientY-dr.y)*sc;zApply()};s.onpointerup=()=>dr=null;s.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.2:.83)}}
const mapScope=()=>U.role=='admin'?D.pts:U.role=='local'?D.pts.filter(p=>p.v==U.village):D.pts.filter(p=>D.pannes.some(n=>n.pt==p.ref&&((n.tech_email&&U.email)?n.tech_email==U.email.toLowerCase():n.tech==U.name)));
function mapV(c){const rs=[...new Set(D.villages.map(v=>v.r))];c.innerHTML=`<h2>${U.role=='admin'?'Cartographie des points d’eau':U.role=='local'?'Carte de '+U.village:'Carte de mes interventions'}</h2><div class="tools" style="margin-top:12px"><select onchange="MF.s=this.value;mapUp()"><option value="">Tous les états</option>${ST.map(x=>`<option ${MF.s==x?'selected':''}>${x}</option>`).join('')}</select>${U.role=='admin'?`<select onchange="MF.r=this.value;mapUp()"><option value="">Toutes les régions</option>${rs.map(r=>`<option ${MF.r==r?'selected':''}>${r}</option>`).join('')}</select>`:''}</div><div class="mapw"><div class="card mc" id="mcz"></div><div class="card" id="mpan"><p class="mut">Touchez un point sur la carte pour ouvrir sa fiche de suivi.</p></div></div>`;mapUp();if(SEL&&mapScope().some(p=>p.ref==SEL))pick(SEL)}
function mapUp(){const L=mapScope().filter(p=>(!MF.s||p.s==MF.s)&&(!MF.r||rg(p)==MF.r)),n=mapScope().filter(p=>p.la==null).length;$('#mcz').innerHTML=mapSvg(L)+`<div class="zb"><button class="btn alt sm" onclick="zoom(1.4)" aria-label="Zoom avant">+</button><button class="btn alt sm" onclick="zoom(.7)" aria-label="Zoom arrière">−</button><button class="btn alt sm" onclick="zoom(0)" aria-label="Recentrer">⟲</button></div><div class="leg">${LEG}</div>`+(n?`<p class="mut">${n} point(s) sans position GPS.</p>`:'')+(L.some(p=>p.la!=null)?'':'<p class="mut">Aucun point localisé pour ce filtre.</p>');mapInit()}
function pick(ref){SEL=ref;const el=$('#mpan');if(!el)return;const p=D.pts.find(x=>x.ref==ref),v=D.villages.find(x=>x.n==p.v)||{},ps=D.pannes.filter(n=>n.pt==ref&&(U.role=='admin'?true:U.role=='local'?((n.by_email&&U.email)?n.by_email==U.email.toLowerCase():n.by==U.name):((n.tech_email&&U.email)?n.tech_email==U.email.toLowerCase():n.tech==U.name)));
el.innerHTML=`<h3>${p.ref} · ${esc(p.n)}</h3>${badge(p.s)}<p class="mut">${p.t} · ${esc(p.v)}, commune de ${esc(v.c||'')}, cercle de ${esc(v.ce||'')}, région de ${esc(v.r||'')}</p>${p.la!=null?`<p><b>Position</b> ${p.la.toFixed(4)}° N, ${Math.abs(p.lo).toFixed(4)}° ${p.lo<0?'O':'E'}<br><a href="https://www.openstreetmap.org/?mlat=${p.la}&mlon=${p.lo}#map=14/${p.la}/${p.lo}" target="_blank" rel="noopener"><u>Voir sur OpenStreetMap</u></a></p>`:'<p class="mut">Position GPS non renseignée.</p>'}<h3>Suivi de l’état</h3>${p.log.map(l=>`<p>${l.d} · ${l.s?badge(l.s):''} ${esc(l.n||'')}</p>`).join('')}<h3>Pannes et interventions</h3>${ps.map(n=>`<p>${esc(n.d)}<br>${badge(n.s)} ${n.tech?'· '+esc(n.tech):''}</p>`).join('')||'<p class="mut">Aucune panne enregistrée.</p>'}<p>${U.role!='local'?`<button class="btn sm" onclick="setPos('${ref}')">${p.la!=null?'Modifier':'Renseigner'} la position</button>`:`<button class="btn sm" onclick="view='dec';route()">Déclarer une panne</button>`}</p>`;el.scrollIntoView({block:'nearest',behavior:'smooth'})}
function setS(i,v){const p=D.pts[i];p.s=v;p.log.unshift({d:today(),s:v});fl();toast('État mis à jour')}
function gps(){const f=$('#m form');if(!navigator.geolocation)return toast('Géolocalisation indisponible sur cet appareil');navigator.geolocation.getCurrentPosition(r=>{f.la.value=r.coords.latitude.toFixed(5);f.lo.value=r.coords.longitude.toFixed(5)},()=>toast('Position refusée ou indisponible : saisissez les coordonnées'))}
function setPos(ref){const p=D.pts.find(x=>x.ref==ref);modal(`<h3>Position de ${p.ref}</h3><form><label>Latitude</label><input name="la" type="number" step="any" required value="${p.la??''}"><label>Longitude</label><input name="lo" type="number" step="any" required value="${p.lo??''}"><p><button type="button" class="btn alt sm" onclick="gps()">Utiliser ma position</button></p><p><button class="btn">Enregistrer</button></p></form>`,x=>{const a=+x.la,o=+x.lo;if(!okPos(a,o)){toast('Position invalide : latitude 10 à 25, longitude −12,5 à 4,4');return false}p.la=a;p.lo=o;p.log.unshift({d:today(),n:'Position mise à jour'});toast('Position enregistrée');mapV($('#c'))})}
route();
</script><script src="/static/suivi/js/backend.js"></script></body></html>
